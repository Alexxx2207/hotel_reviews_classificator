[project]
name = "hotel-reviews-classificator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.4.2",
    "kagglehub>=0.4.1",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.39.0",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
# So "from src.xxx" resolves when pylint runs from project root
init-hook = 'import sys; from pathlib import Path; sys.path.insert(0, str(Path.cwd()))'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = [
    "kagglehub.*",
    "streamlit.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pylint>=4.0.4",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
