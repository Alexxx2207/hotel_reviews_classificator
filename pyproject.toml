[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-reviews-classificator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4.2",
    "joblib-stubs>=1.5.3.1.20260117",
    "kagglehub>=0.4.1",
    "matplotlib>=3.10.8",
    "mypy>=1.19.1",
    "pandas>=2.3.3",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.39.0",
    "torch>=2.9.1",
    "transformers>=4.45.0",
    "tqdm>=4.66.5",
    "types-seaborn>=0.13.2.20251221",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
# So "from src.xxx" resolves when pylint runs from project root
init-hook = 'import sys; from pathlib import Path; sys.path.insert(0, str(Path.cwd()))'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = [
    "joblib.*",
    "kagglehub.*",
    "sklearn.*",
    "streamlit.*",
    "tqdm.*",
    "transformers.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pylint>=4.0.4",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
